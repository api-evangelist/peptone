name: Peptone
description: 'Peptone is a computational drug-discovery biotech building a Product Engine
  that targets intrinsically disordered proteins (IDPs). It couples experimental measurement
  of disordered proteins in solution with enhanced-sampling simulation and generative
  machine-learning models to resolve transient, druggable pockets and design small-molecule
  drug candidates against them. Peptone describes its stack as an end-to-end Protein
  Engineering Operating System (PeOS); its open-source research tooling (protein-disorder
  prediction, ensemble generators, protein language models) is published on GitHub.
  Peptone is a Bessemer Venture Partners portfolio company. No public developer API,
  documentation, or SDK surface was found during enrichment.'
